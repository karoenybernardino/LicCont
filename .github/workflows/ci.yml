name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # No main nunca cancela: um push novo não pode interromper o job migracoes.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Imagens do Semgrep e do Gitleaks: o Dependabot não atualiza; revisar à mão.
# Nomes dos jobs = checagens obrigatórias em docs/decisoes/0002-protecao-do-main.md.
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run lint
      # Só dependências de produção; falha em vulnerabilidade alta ou crítica.
      - run: npm audit --omit=dev --audit-level=high

  tipos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run tipos

  vitest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm test

  playwright:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with: { node-version: 24, cache: npm }
      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1.7.3
        with:
          version: 3.0.0
      # Supabase local com o seed fictício; os usuários de teste nascem no
      # tests/e2e/preparar.ts. Nada aqui toca o projeto de produção.
      - name: Subir o Supabase local
        run: supabase start -x studio,imgproxy,realtime,edge-runtime,logflare,vector,postgres-meta,supavisor,mailpit
      - name: Variáveis do Supabase local
        run: |
          supabase status -o env > "$RUNNER_TEMP/supabase.env"
          cut -d= -f1 "$RUNNER_TEMP/supabase.env"
          set -a; . "$RUNNER_TEMP/supabase.env"; set +a
          ANON="${ANON_KEY:-$PUBLISHABLE_KEY}"
          SERVICO="${SERVICE_ROLE_KEY:-$SECRET_KEY}"
          SEGREDO="$(openssl rand -hex 32)"
          echo "::add-mask::$SERVICO"
          echo "::add-mask::$SEGREDO"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICO"
            echo "E2E_DB_URL=$DB_URL"
            echo "LOGIN_HASH_SEGREDO=$SEGREDO"
          } >> "$GITHUB_ENV"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  pgtap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1.7.3
        with:
          version: 3.0.0
      - run: supabase db start
      - run: supabase test db

  semgrep:
    runs-on: ubuntu-latest
    container: semgrep/semgrep:1.184.0
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      # CLI aberta, sem conta e sem envio de métricas.
      - run: semgrep scan --metrics=off --error --config p/default --config p/typescript --config p/react --config p/nextjs

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      # CLI aberta via imagem oficial (a action exige licença em organizações).
      # Em PR, varre só os commits do PR; no main, o histórico inteiro.
      - name: Buscar segredos
        env:
          INTERVALO: ${{ github.event_name == 'pull_request' && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || '' }}
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git /repo --redact --verbose ${INTERVALO:+--log-opts="$INTERVALO"}

  # Aplica as migrações em produção depois do merge. Decisão 0005.
  # Só no push do main e só com todos os checks verdes.
  migracoes:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint, tipos, vitest, playwright, pgtap, semgrep, gitleaks]
    runs-on: ubuntu-latest
    concurrency:
      group: migracoes-producao
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1.7.3
        with:
          version: 3.0.0
      # Só a string de conexão do banco do LicCont, sem token da conta Supabase
      # (que alcançaria também os projetos do Prummo). Nunca ligar --debug aqui.
      - name: Aplicar migrações no projeto LicCont
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::Falta o segredo SUPABASE_DB_URL (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          # Sem terminal o CLI não confirma sozinho: --yes é obrigatório.
          supabase db push --remote="$SUPABASE_DB_URL" --yes
