name: Carga

# Teste de carga com 100 mil documentos fictícios no Supabase LOCAL do runner.
# Nada aqui toca o projeto de produção. Roda à mão (Actions > Carga > Run) e
# nos PRs que mexem nos scripts de carga. Resultado: resumo do job e artefato.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - supabase/carga/**
      - .github/workflows/carga.yml

permissions:
  contents: read

jobs:
  carga:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1.7.3
        with:
          version: 3.0.0
      - run: supabase db start
      - name: Gerar dados fictícios
        run: psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/carga/carga.sql
      - name: Medir
        run: |
          nproc; free -h
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/carga/medir.sql | tee resultado-carga.txt
          { echo '```'; cat resultado-carga.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: resultado-carga
          path: resultado-carga.txt
          retention-days: 30
